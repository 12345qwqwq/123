<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BYSTANDER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070912; --ice:#8fc3e6; --ice-dim:#5d7f96; --line:rgba(143,195,230,.16); }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ice);display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% -10%, rgba(60,90,130,.22), transparent 60%), var(--bg);}
  header{flex:0 0 auto;padding:14px 18px 10px;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);backdrop-filter:blur(4px);z-index:5;}
  header h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:26px;letter-spacing:.5px;color:#cfe6f5;line-height:1;}
  header .sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ice-dim);}
  #stage{position:relative;flex:1 1 auto;overflow:hidden;}
  canvas{position:absolute;inset:0;display:block;touch-action:none;width:100%;height:100%;}
  #fx{pointer-events:none;}
  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:10.5px;letter-spacing:1.5px;color:var(--ice-dim);pointer-events:none;text-align:center;transition:opacity .6s;text-shadow:0 1px 8px #000;z-index:6;}
  #meter{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:180px;height:2px;background:rgba(143,195,230,.18);border-radius:2px;overflow:hidden;z-index:6;transition:opacity .5s;}
  #meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#8fc3e6,#ff7a1e);}
  #panel{position:absolute;right:12px;top:12px;z-index:10;width:228px;max-width:calc(100vw - 24px);background:rgba(10,13,24,.78);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 18px 50px -20px #000;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  #panel.collapsed{transform:translateX(calc(100% + 16px));}
  #panel .head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);}
  #panel .head span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ice-dim);}
  #panel .body{padding:6px 13px 13px;}
  .row{margin-top:11px;} .row label{display:flex;justify-content:space-between;font-size:11px;color:#a9c8db;margin-bottom:5px;} .row label b{color:var(--ice);font-weight:600;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:linear-gradient(90deg,var(--ice),var(--ice-dim));border-radius:3px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#dff0fb;border:2px solid #4d6b80;box-shadow:0 0 10px rgba(143,195,230,.6);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#dff0fb;border:2px solid #4d6b80;cursor:pointer;}
  .btns{display:flex;gap:8px;margin-top:15px;}
  button{flex:1;font-family:inherit;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ice);background:rgba(143,195,230,.08);border:1px solid var(--line);border-radius:9px;padding:9px 6px;cursor:pointer;transition:background .2s;}
  button:hover{background:rgba(143,195,230,.18);}
  #toggle{position:absolute;right:12px;top:12px;z-index:9;width:38px;height:38px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:16px;padding:0;}
  #toggle.show{display:flex;} .close{flex:0;width:26px;height:26px;border-radius:7px;padding:0;font-size:14px;}
  #stage.knife{cursor:none;}
</style>
</head>
<body>
  <header><h1>Bystander</h1><span class="sub">part one &mdash; into &mdash; part two</span></header>
  <div id="stage">
    <canvas id="scene"></canvas>
    <canvas id="fx"></canvas>
    <div id="hint">move across the face &mdash; deform the letters until the page is ready to burn</div>
    <div id="meter"><i></i></div>
    <button id="toggle" title="controls">&#9881;</button>
    <div id="panel">
      <div class="head"><span>controls</span><button class="close" id="closeP">&times;</button></div>
      <div class="body">
        <div class="row"><label>blade size <b id="vBlade">1.0</b></label><input id="sBlade" type="range" min="0.5" max="2.2" step="0.1" value="1"></div>
        <div class="row"><label>shed chance <b id="vShed">1.0</b></label><input id="sShed" type="range" min="0.2" max="2.5" step="0.1" value="1"></div>
        <div class="row"><label>text size <b id="vFont">1.0</b></label><input id="sFont" type="range" min="0.7" max="1.4" step="0.05" value="1"></div>
        <div class="btns"><button id="replay">replay</button></div>
      </div>
    </div>
  </div>
<script>
"use strict";
/* =======================================================================
   BYSTANDER — Part One (letter portrait) burns into Part Two (No.17 text)
   Single self-contained file. Pure 2D canvas. OOP classes; tunables in C.
   Flow: PORTRAIT -> (touch 80%) BURN (knife, paint burn, charred edges)
         -> (burn 90% auto-finish) PRINT (line by line, bold key, ink smear)
         -> INTERACT (slide sheds letters: gravity/spin/wall-bounce/floor)
            floor hit -> hard impact + colourful droplet burst
         -> (enough shed) MELT -> central dynamic teardrop.
   ======================================================================= */

/* ------------------------------ GLOBAL CONSTANTS --------------------- */

  // portrait grid (from Part One)
  GN:13, GX:2, GY:4, GRAD:90, GSCALE:2.6, BASE_W:400, MAX_W:820,
  TOUCH_THRESHOLD:0.80,

  // text
  MARGIN_X_F:0.085, MARGIN_TOP:62, MARGIN_BOT:54, LINE_RATIO:1.6, FONT_MAX:24, FONT_MIN:10,
  PRINT_LINE_MS:130,
  // shedding letters -> physics
  DETACH_PROB:0.55, DETACH_R:34, GRAVITY:0.55, H_PERTURB:3.2, SPIN:0.25,
  WALL_RESTITUTION:0.55, FLOOR_MARGIN:8,
  MELT_AFTER_SHED:42,
  // droplet burst on floor impact

  DROP_COUNT:[10,18], DROP_SPEED:7, DROP_GRAVITY:0.4, DROP_LIFE:[28,60],
  // melt / teardrop
  MELT_MS:3200,
  TEAR_INK:'#16110c', TEAR_SHEEN:'#bcd8ff',
};

/* assets injected from Part One */
const SOURCE = `You are the most dazzling star of this age. The glass curtain walls
downtown, every inch of them worth a fortune, are fit only to be your
backdrop. Your face is printed on every LED screen; the neon traces the
perfect line of your jaw, making those office towers look like cheap
scenery. People stop in their tracks and look up at you. Then they
empty their wallets gladly, buying the perfume you endorse, the jewels,
the magazine covers, even a concert ticket they could never get their
hands on. You are used to it. A custom couch soft as cloud holds your
body; you lie half reclined, gazing idly past the floor to ceiling
window. The city spreads beneath your feet, the traffic like veins, the
neon like a pulse. Your manager stands three steps away. Try not to
bring up last month's scandal in tonight's interview. Also, the brand
hopes you can tomorrow. How annoying. The crystal glass bursts on the
marble, the sound clean and lovely, like one complete curse. The manager
falls silent. You are satisfied with that. You are fairly satisfied with
life too, except the assistant is stupid, the schedule is dense, the
admirers too loud. I would give my whole life to you, you cannot help
thinking, is your life any good? Enough to buy a few seconds of my time?
But you swallow the cruelty. You smile. Please keep supporting me, all
right? I like you all too. The shutters click and click, the screams
break over you like waves. You like the screaming, the magnesium light,
the scorching gazes, perhaps. Because it makes your heart pound wildly.
You seem to have been born drawn to these things. You slip calmly into
the van, the door shutting everything out. The leather seat is cold and
smooth, and the feel of it makes you think of those faces. Left too long
under the sun, perhaps, oily, sweat damp, twisted with excitement. You
frown. The windows wear the darkest film; outside becomes a blur of
grey. You see your reflection in the glass, and your hand cannot help
touching your own face. The makeup artist leans in at once, the powder
puff hovering, careful as if restoring a piece of porcelain.`;

/* Part Two narrative; *...* marks heavier (key) content */
const STORY = [
  "You are *number seventeen* at the home for the disabled. A single sweet, once, undid the whole of your life.",
  "The man crouched down. The wrapper turned between his fingers, and the sun broke a small rainbow across it. You reached out your hand.",
  "Then the basement. Very small. The air damp and mouldy, like a coffin measured in advance to fit you. The bare bulb buzzed overhead, white and scalding, and seared the tears from your eyes.",
  "When the *acid* touched your face you learned what worst could mean. The pain was close to dying. You screamed, and the sound came back at you off the concrete, again and again.",
  "He studied you the way a sculptor studies an unfinished work. But what he wanted was *ruin*. A little asymmetry is better, he said. And the voice is a problem too. The tip of the knife pressed against skin.",
  "He left you at the edge of the road, with a square of cardboard: born this way, no one in the world, kind people please help. You wanted to scream that someone had *done this to you*, that they should call *the police*, that you would *kill him*. But you could not make a sound.",
  "Coins dropped into the tin bowl. Someone crouched, said what a poor child, then stood and walked away. You lowered your head. In the stacked coins, blurred, a face. *Who are you?*"
];

/* ------------------------------ small helpers ------------------------ */
const $ = id => document.getElementById(id);
function newCanvas(w,h,dpr){ const cv=document.createElement('canvas'); cv.width=w*dpr; cv.height=h*dpr; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return {cv,c}; }
function clear(c,w,h){ c.clearRect(0,0,w,h); }
function rand(a,b){ return a+Math.random()*(b-a); }
function smooth(t){ return t*t*(3-2*t); }

/* ------------------------------ PAPER -------------------------------- */
class Paper {
  constructor(){ this.cv=null; }
  build(w,h,dpr){
    const {cv,c}=newCanvas(w,h,dpr); this.cv=cv; this.c=c;
    const g=c.createLinearGradient(0,0,w*0.3,h); g.addColorStop(0,C.PAPER_TOP); g.addColorStop(1,C.PAPER_BOT);
    c.fillStyle=g; c.fillRect(0,0,w,h);
    c.globalAlpha=0.05;
    for(let i=0;i<Math.min(2400,w*h/380);i++){ const x=Math.random()*w,y=Math.random()*h,l=2+Math.random()*7,a=Math.random()*Math.PI;
      c.strokeStyle=Math.random()<0.5?'#6b5836':'#fffaf0'; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); c.stroke(); }
    c.globalAlpha=1;
    for(let i=0;i<7;i++){ const x=Math.random()*w,y=Math.random()*h,r=40+Math.random()*120; const rg=c.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,'rgba(120,92,50,'+(0.04+Math.random()*0.05)+')'); rg.addColorStop(1,'rgba(120,92,50,0)'); c.fillStyle=rg; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }
    const vg=c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.32,w/2,h/2,Math.max(w,h)*0.62);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(60,40,18,0.30)'); c.fillStyle=vg; c.fillRect(0,0,w,h);
  }
}

/* ------------------------------ PORTRAIT (Part One) ------------------ */
class Portrait {
  constructor(img){ this.img=img; this.P={n:C.GN,X:C.GX,y:C.GY,r:C.GRAD,s:C.GSCALE}; this.chars=[]; this.touched=new Set(); this.live=new Set(); this.dirty=true; }
  _fit(w,h){ const ar=this.img.naturalWidth/this.img.naturalHeight; let dw=w,dh=w/ar; if(dh>h){dh=h;dw=h*ar;} return {dw,dh,ox:(w-dw)/2,oy:(h-dh)/2}; }
  build(w,h,dpr){
    this.W=w; this.H=h;
    const {cv,c}=newCanvas(w,h,dpr); this.cv=cv; this.c=c;
    c.textAlign='center'; c.textBaseline='middle';
    c.font=`${C.BASE_W} ${this.P.n}px 'JetBrains Mono',monospace`;
    const adv=c.measureText('M').width||this.P.n*0.6;
    this.cellW=adv+this.P.X; this.cellH=this.P.n+this.P.y;
    const fit=this._fit(w,h);
    this.cols=Math.max(1,Math.floor(fit.dw/this.cellW)); this.rows=Math.max(1,Math.floor(fit.dh/this.cellH));
    const gW=this.cols*this.cellW,gH=this.rows*this.cellH; this.offX=fit.ox+(fit.dw-gW)/2; this.offY=fit.oy+(fit.dh-gH)/2;
    const sc=document.createElement('canvas'); sc.width=this.cols; sc.height=this.rows; const sx=sc.getContext('2d');
    sx.drawImage(this.img,0,0,this.cols,this.rows); const data=sx.getImageData(0,0,this.cols,this.rows).data;
    this.chars=[]; this.touched.clear(); this.live.clear(); let k=0;
    for(let r=0;r<this.rows;r++)for(let cc=0;cc<this.cols;cc++){ const i=(r*this.cols+cc)*4;
      const R=Math.max(data[i],22),G=Math.max(data[i+1],26),B=Math.max(data[i+2],34);
      this.chars.push({cx:this.offX+cc*this.cellW+this.cellW/2, cy:this.offY+r*this.cellH+this.cellH/2,
        ch:TEXT[k++%TEXT.length], col:`rgb(${R},${G},${B})`, scale:1, weight:C.BASE_W, rot:0, rotDir:Math.random()<.5?-1:1, jit:0, jx:0, jy:0}); }
    this.dirty=true;
  }
  coverage(){ return this.touched.size/Math.max(1,this.chars.length); }
  influence(px,py,now){
    const r=this.P.r, cC=(px-this.offX)/this.cellW, cR=(py-this.offY)/this.cellH;
    const sC=Math.ceil(r/this.cellW)+1, sR=Math.ceil(r/this.cellH)+1;
    const c0=Math.max(0,Math.floor(cC-sC)),c1=Math.min(this.cols-1,Math.ceil(cC+sC));
    const r0=Math.max(0,Math.floor(cR-sR)),r1=Math.min(this.rows-1,Math.ceil(cR+sR));
    for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){ const idx=rr*this.cols+cc, ch=this.chars[idx]; if(!ch)continue;
      const dx=ch.cx-px,dy=ch.cy-py,d=Math.hypot(dx,dy);
      if(d<r){ const t=smooth(1-d/r),app=t*0.14;
        ch.scale+=(this.P.s-ch.scale)*app; ch.weight+=(C.MAX_W-ch.weight)*app; ch.rot+=ch.rotDir*t*0.045;
        if(ch.rot>1.25)ch.rot=1.25; if(ch.rot<-1.25)ch.rot=-1.25; ch.jit=now+500;
        this.touched.add(idx); this.live.add(idx); } }
    this.dirty=true;
  }
  step(now){ for(const idx of this.live){ const ch=this.chars[idx];
    if(now<ch.jit){ const a=Math.min(2,0.6+ch.scale*0.5); ch.jx=rand(-a,a); ch.jy=rand(-a,a); } else { ch.jx=0; ch.jy=0; this.live.delete(idx); } } }
  render(){ const c=this.c,w=this.W,h=this.H; const bg=c.createRadialGradient(w/2,-h*0.1,h*0.1,w/2,h*0.2,h*1.1);
    bg.addColorStop(0,'rgba(60,90,130,.22)'); bg.addColorStop(1,C.COLD_BG); c.fillStyle=C.COLD_BG; c.fillRect(0,0,w,h); c.fillStyle=bg; c.fillRect(0,0,w,h);
    const base=`${C.BASE_W} ${this.P.n}px 'JetBrains Mono',monospace`; c.font=base; c.textAlign='center'; c.textBaseline='middle';
    const now=performance.now();
    for(const ch of this.chars){ if(ch.scale!==1||ch.rot!==0||ch.weight!==C.BASE_W||ch.jit>now)continue; c.fillStyle=ch.col; c.fillText(ch.ch,ch.cx,ch.cy); }
    for(const ch of this.chars){ if(ch.scale===1&&ch.rot===0&&ch.weight===C.BASE_W&&ch.jit<=now)continue;
      c.save(); c.translate(ch.cx+ch.jx,ch.cy+ch.jy); c.rotate(ch.rot); c.scale(ch.scale,ch.scale);
      c.font=`${Math.round(ch.weight)} ${this.P.n}px 'JetBrains Mono',monospace`; c.fillStyle=ch.col; c.fillText(ch.ch,0,0); c.restore(); }
    this.dirty=false;
  }
}

/* ------------------------------ BURN FIELD --------------------------- */
class BurnField {
  constructor(){ }
  build(w,h,dpr){ this.W=w; this.H=h; this.dpr=dpr;
    this.char=newCanvas(w,h,dpr); this.burn=newCanvas(w,h,dpr); this.work=newCanvas(w,h,dpr);
    this.blade=C.BLADE_BASE; this.fill=0; this.autofilling=false; this._t0=0; }
  setBlade(scale){ this.blade=C.BLADE_BASE*scale; }
  stroke(x0,y0,x1,y1){ const d=Math.hypot(x1-x0,y1-y0), steps=Math.max(1,Math.floor(d/6));
    for(let i=0;i<=steps;i++){ const t=i/steps; this.stamp(x0+(x1-x0)*t, y0+(y1-y0)*t); } }
  stamp(x,y){ const rh=this.blade*C.R_HOLE_F, rc=this.blade*C.R_CHAR_F;
    // charred ring on char layer
    const cc=this.char.c; const cg=cc.createRadialGradient(x,y,rh*0.45,x,y,rc);
    cg.addColorStop(0,'rgba(26,15,6,0)'); cg.addColorStop(0.45,'rgba(40,18,8,0.55)'); cg.addColorStop(0.8,'rgba(20,10,4,0.85)'); cg.addColorStop(1,'rgba(10,5,2,0)');
    cc.fillStyle=cg; cc.beginPath(); cc.arc(x,y,rc,0,7); cc.fill();
    // erase hole on burn mask (broken by satellite dabs)
    const bc=this.burn.c; const bg=bc.createRadialGradient(x,y,0,x,y,rh*1.15);
    bg.addColorStop(0,'rgba(255,255,255,0.95)'); bg.addColorStop(0.7,'rgba(255,255,255,0.8)'); bg.addColorStop(1,'rgba(255,255,255,0)');
    bc.fillStyle=bg; bc.beginPath(); bc.arc(x,y,rh*1.15,0,7); bc.fill();
    for(let i=0;i<4;i++){ const a=Math.random()*7,rr=rh*rand(0.6,1.3),px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr,s=rh*rand(0.2,0.5);
      const sg=bc.createRadialGradient(px,py,0,px,py,s); sg.addColorStop(0,'rgba(255,255,255,0.7)'); sg.addColorStop(1,'rgba(255,255,255,0)'); bc.fillStyle=sg; bc.beginPath(); bc.arc(px,py,s,0,7); bc.fill(); }
  }
  coverage(){ const sw=72,sh=Math.max(8,Math.round(72*this.H/this.W)); const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    const t=tmp.getContext('2d'); t.drawImage(this.burn.cv,0,0,sw,sh); const d=t.getImageData(0,0,sw,sh).data; let n=0; for(let i=3;i<d.length;i+=4) if(d[i]>120)n++; return n/(sw*sh); }
  autofill(now){ if(!this.autofilling){ this.autofilling=true; this._t0=now; this._seeds=[]; for(let i=0;i<10;i++)this._seeds.push({x:Math.random()*this.W,y:Math.random()*this.H}); }
    const k=Math.min(1,(now-this._t0)/C.AUTOFILL_MS); this.fill=k;
    const R=Math.hypot(this.W,this.H)*0.16*k; for(const s of this._seeds) this.stamp(s.x,s.y), this.blade=Math.max(this.blade,R); this.blade=C.BLADE_BASE+R;
    return k>=1; }
  composite(dest, paperCv, portraitCv){ const c=dest, w=this.W, h=this.H;
    c.clearRect(0,0,w,h); c.drawImage(paperCv,0,0,w,h); c.drawImage(this.char.cv,0,0,w,h);
    // portrait with burned holes
    const wc=this.work.c; wc.clearRect(0,0,w,h); wc.globalCompositeOperation='source-over'; wc.drawImage(portraitCv,0,0,w,h);
    wc.globalCompositeOperation='destination-out'; wc.drawImage(this.burn.cv,0,0,w,h); wc.globalCompositeOperation='source-over';
    c.drawImage(this.work.cv,0,0,w,h);
  }
  bakedBackground(paperCv){ const {cv,c}=newCanvas(this.W,this.H,this.dpr); c.drawImage(paperCv,0,0,this.W,this.H); c.drawImage(this.char.cv,0,0,this.W,this.H); return cv; }
}

/* ------------------------------ TYPESETTER (Part Two) ---------------- */
class Typesetter {
  constructor(paper){ this.paper=paper; this.glyphs=[]; this.lines=0; this.printed=0; }
  _tokenize(p){ const words=[]; let bold=false, cur=null;
    for(const ch of p){ if(ch==='*'){ bold=!bold; continue; } if(ch===' '){ if(cur){words.push(cur);cur=null;} continue; } if(!cur)cur={chars:[]}; cur.chars.push({ch,bold}); }
    if(cur)words.push(cur); for(const w of words)w.len=w.chars.length; return words; }
  layout(w,h,dpr,fontScale){ this.W=w; this.H=h; this.dpr=dpr;
    const {cv,c}=newCanvas(w,h,dpr); this.cv=cv; this.c=c;
    const boxX=Math.round(w*C.MARGIN_X_F), boxW=w-2*boxX, boxTop=C.MARGIN_TOP, boxBot=h-C.MARGIN_BOT, boxH=boxBot-boxTop;
    let fs=Math.min(C.FONT_MAX,w/30)*fontScale, lines, charW, lh;
    for(;;){ c.font=`${fs}px 'JetBrains Mono',monospace`; charW=c.measureText('M').width; lines=this._wrap(charW,boxW);
      lh=fs*C.LINE_RATIO; if(lines.length*lh<=boxH||fs<=C.FONT_MIN)break; fs*=0.96; }
    this.fs=fs; this.charW=charW; const spaceW=charW;
    this.glyphs=[]; let y=boxTop+lh*0.72, li=0;
    for(const line of lines){ if(line.blank){ y+=lh*0.5; continue; }
      const n=line.words.length, natural=line.words.reduce((s,wd)=>s+wd.len*charW,0)+spaceW*(n-1);
      let gap=spaceW; if(!line.paraEnd&&n>1)gap=spaceW+(boxW-natural)/(n-1);
      let x=boxX; for(let wi=0;wi<n;wi++){ const wd=line.words[wi]; for(const g of wd.chars){ this.glyphs.push({ch:g.ch,bold:g.bold,x,y,line:li,removed:false,phase:Math.random()*6.28}); x+=charW; } x+=gap; } y+=lh; li++; }
    this.lines=li; this.printed=0;
  }
  _wrap(charW,boxW){ const out=[]; const spaceW=charW;
    for(const para of STORY){ const words=this._tokenize(para); let cur=[],curW=0;
      for(const wd of words){ const ww=wd.len*charW, add=(cur.length?spaceW:0)+ww;
        if(cur.length&&curW+add>boxW){ out.push({words:cur,paraEnd:false}); cur=[]; curW=0; } cur.push(wd); curW+=(cur.length>1?spaceW:0)+ww; }
      if(cur.length)out.push({words:cur,paraEnd:true}); out.push({blank:true}); }
    return out; }
  advanceLine(){ if(this.printed<this.lines)this.printed++; return this.printed>=this.lines; }
  render(){ const c=this.c,w=this.W,h=this.H; c.clearRect(0,0,w,h); c.textAlign='left'; c.textBaseline='alphabetic';
    let curBold=null; for(const g of this.glyphs){ if(g.removed||g.line>=this.printed)continue;
      if(g.bold!==curBold){ curBold=g.bold; c.font=`${curBold?800:400} ${this.fs}px 'JetBrains Mono',monospace`; }
      c.fillStyle=C.INK; c.fillText(g.ch,g.x,g.y); }
  }
  near(x,y,r){ const out=[],r2=r*r; for(const g of this.glyphs){ if(g.removed||g.line>=this.printed)continue; const dx=g.x-x,dy=g.y-(this.fs*0.35)-y; if(dx*dx+dy*dy<r2)out.push(g); } return out; }
  remaining(){ return this.glyphs.filter(g=>!g.removed&&g.line<this.printed); }
}

/* ------------------------------ INK SMEAR ---------------------------- */
class Ink {
  build(w,h,dpr){ this.W=w; this.H=h; const {cv,c}=newCanvas(w,h,dpr); this.cv=cv; this.c=c; }
  smear(x,y,vx,vy){ const c=this.c; for(let i=0;i<4;i++){ const t=i/4,px=x-vx*t*2.2,py=y-vy*t*2.2,r=9+i*3.5;
    const g=c.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,'rgba(24,16,10,0.10)'); g.addColorStop(1,'rgba(24,16,10,0)'); c.fillStyle=g; c.beginPath(); c.arc(px,py,r,0,7); c.fill(); } }
}

/* ------------------------------ PHYSICS LETTER ----------------------- */
class PhysicsLetter {
  constructor(g,fs,vx){ this.ch=g.ch; this.bold=g.bold; this.x=g.x; this.y=g.y; this.fs=fs;
    this.vx=vx*rand(0.4,1)+rand(-C.H_PERTURB,C.H_PERTURB); this.vy=rand(-2,1); this.rot=0; this.w=rand(-C.SPIN,C.SPIN); this.dead=false; }
  step(wallL,wallR,floorY){ this.vy+=C.GRAVITY; this.x+=this.vx; this.y+=this.vy; this.rot+=this.w;
    const hw=this.fs*0.4;
    if(this.x<wallL+hw){ this.x=wallL+hw; this.vx=-this.vx*C.WALL_RESTITUTION; this.w*=0.7; }
    if(this.x>wallR-hw){ this.x=wallR-hw; this.vx=-this.vx*C.WALL_RESTITUTION; this.w*=0.7; }
    if(this.y>=floorY){ this.dead=true; return this.x; } return null; }
  draw(c){ c.save(); c.translate(this.x,this.y); c.rotate(this.rot); c.font=`${this.bold?800:400} ${this.fs}px 'JetBrains Mono',monospace`;
    c.fillStyle=C.INK; c.textAlign='center'; c.textBaseline='middle'; c.fillText(this.ch,0,0); c.restore(); }
}

/* ------------------------------ DROPLET + IMPACT --------------------- */
class Droplet {
  constructor(x,y,col){ this.x=x; this.y=y; const a=rand(-Math.PI*0.85,-Math.PI*0.15); const sp=C.DROP_SPEED*rand(0.5,1.2);
    this.vx=Math.cos(a)*sp; this.vy=Math.sin(a)*sp; this.col=col; this.r=rand(1.5,3.8); this.life=rand(C.DROP_LIFE[0],C.DROP_LIFE[1]); this.age=0; }
  step(){ this.vy+=C.DROP_GRAVITY; this.x+=this.vx; this.y+=this.vy; this.age++; return this.age<this.life; }
  draw(c){ const t=1-this.age/this.life; c.globalAlpha=t; c.fillStyle=this.col; c.beginPath(); c.arc(this.x,this.y,this.r*t,0,7); c.fill(); c.globalAlpha=1; }
}
class Impact {
  constructor(x,y){ this.x=x; this.y=y; this.age=0; this.life=20; this.drops=[]; const n=Math.round(rand(C.DROP_COUNT[0],C.DROP_COUNT[1]));
    for(let i=0;i<n;i++)this.drops.push(new Droplet(x,y,C.DROP_COLORS[(Math.random()*C.DROP_COLORS.length)|0])); }
  step(){ this.age++; this.drops=this.drops.filter(d=>d.step()); return this.age<this.life||this.drops.length>0; }
  draw(c){ if(this.age<this.life){ const t=1-this.age/this.life, w=10+this.age*4; c.strokeStyle=`rgba(255,235,210,${t*0.7})`; c.lineWidth=2*t;
      c.beginPath(); c.ellipse(this.x,this.y,w,w*0.32,0,0,7); c.stroke(); } for(const d of this.drops)d.draw(c); }
}

/* ------------------------------ APP ---------------------------------- */
const ST={PORTRAIT:0,BURN:1,AUTOFILL:2,PRINT:3,INTERACT:4,MELT:5,END:6};
class App {
  constructor(img){
    this.img=img; this.stage=$('stage'); this.scene=$('scene'); this.fx=$('fx');
    this.sc=this.scene.getContext('2d'); this.fc=this.fx.getContext('2d');
    this.hint=$('hint'); this.meterWrap=$('meter'); this.meter=this.meterWrap.firstElementChild;
    this.paper=new Paper(); this.portrait=new Portrait(img); this.burn=new BurnField(); this.type=new Typesetter(this.paper); this.ink=new Ink();
    this.letters=[]; this.impacts=[]; this.embers=[];
    this.state=ST.PORTRAIT; this.ptr={x:0,y:0,px:0,py:0,active:false}; this.shed=0;
    this.bladeScale=1; this.shedScale=1; this.fontScale=1;
    this.printTimer=0; this.meltT0=0; this.tear={t:0};
    this._bind(); this.resize(); requestAnimationFrame(t=>this.loop(t));
  }
  resize(){ const w=this.stage.clientWidth,h=this.stage.clientHeight; this.W=w; this.H=h; this.dpr=Math.min(window.devicePixelRatio||1,2);
    for(const cv of [this.scene,this.fx]){ cv.width=w*this.dpr; cv.height=h*this.dpr; } this.sc.setTransform(this.dpr,0,0,this.dpr,0,0); this.fc.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.paper.build(w,h,this.dpr); this.portrait.build(w,h,this.dpr); this.burn.build(w,h,this.dpr); this.burn.setBlade(this.bladeScale);
    this.type.layout(w,h,this.dpr,this.fontScale); this.ink.build(w,h,this.dpr);
    this._reset(); }
  _reset(){ this.state=ST.PORTRAIT; this.portrait.build(this.W,this.H,this.dpr); this.burn.build(this.W,this.H,this.dpr); this.burn.setBlade(this.bladeScale);
    this.ink.build(this.W,this.H,this.dpr); this.letters=[]; this.impacts=[]; this.embers=[]; this.shed=0; this.type.printed=0;
    this.meterWrap.style.opacity=1; this.meter.style.width='0%'; this.hint.style.opacity=1; this.hintGone=false; this.stage.classList.remove('knife'); this.bakedBg=null; }
  _bind(){
    const move=e=>{ const r=this.stage.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      this.ptr.px=this.ptr.x; this.ptr.py=this.ptr.y; this.ptr.x=cx; this.ptr.y=cy; this.ptr.active=true; this._input(); if(!this.hintGone){this.hintGone=true; this.hint.style.opacity=0;} };
    this.stage.addEventListener('pointermove',move,{passive:true}); this.stage.addEventListener('pointerdown',e=>{move(e);},{passive:true});
    this.stage.addEventListener('pointerup',()=>this.ptr.active=false); this.stage.addEventListener('pointerleave',()=>this.ptr.active=false);
    let rt=null; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>this.resize(),160);});
    const panel=$('panel'),toggle=$('toggle'); $('closeP').onclick=()=>{panel.classList.add('collapsed');toggle.classList.add('show');}; toggle.onclick=()=>{panel.classList.remove('collapsed');toggle.classList.remove('show');};
    const bind=(id,disp,fn,fmt)=>{const el=$(id),o=$(disp); el.oninput=()=>{fn(parseFloat(el.value)); o.textContent=fmt?fmt(el.value):el.value;};};
    bind('sBlade','vBlade',v=>{this.bladeScale=v; this.burn.setBlade(v);},v=>(+v).toFixed(1));
    bind('sShed','vShed',v=>this.shedScale=v,v=>(+v).toFixed(1));
    bind('sFont','vFont',v=>{this.fontScale=v; this.type.layout(this.W,this.H,this.dpr,v);},v=>(+v).toFixed(2));
    $('replay').onclick=()=>this._reset();
  }
  _input(){ const p=this.ptr;
    if(this.state===ST.PORTRAIT){ this.portrait.influence(p.x,p.y,performance.now());
      const cov=this.portrait.coverage(); this.meter.style.width=Math.min(100,cov/C.TOUCH_THRESHOLD*100)+'%';
      if(cov>=C.TOUCH_THRESHOLD)this._enterBurn(); }
    else if(this.state===ST.BURN){ this.burn.stroke(p.px||p.x,p.py||p.y,p.x,p.y);
      for(let i=0;i<2;i++)this.embers.push({x:p.x+rand(-8,8),y:p.y+rand(-8,8),vx:rand(-0.6,0.6),vy:-rand(0.6,1.8),life:rand(20,50),age:0,col:C.EMBER_COLORS[(Math.random()*C.EMBER_COLORS.length)|0],s:rand(1,2.4)});
      this.meter.style.width=Math.min(100,this.burn.coverage()/C.BURN_DONE*100)+'%'; }
    else if(this.state===ST.INTERACT){ this.ink.smear(p.x,p.y,p.x-p.px,p.y-p.py); this._shedLetters(); }
  }
  _enterBurn(){ this.state=ST.BURN; this.portrait.render(); this.portrait.dirty=false; this.stage.classList.add('knife'); this.hint.style.opacity=0; }
  _shedLetters(){ const p=this.ptr; const gs=this.type.near(p.x,p.y,C.DETACH_R); const vx=(p.x-p.px);
    for(const g of gs){ if(Math.random()<C.DETACH_PROB*this.shedScale){ g.removed=true; this.letters.push(new PhysicsLetter(g,this.type.fs,vx)); } } }
  _startMelt(){ this.state=ST.MELT; this.meltT0=performance.now(); this.meltGlyphs=this.type.remaining().map(g=>({g,x0:g.x,y0:g.y,sx:1,sy:1})); this.stage.classList.remove('knife'); }
  loop(now){
    // ---- update ----
    if(this.state===ST.PORTRAIT){ this.portrait.step(now); }
    else if(this.state===ST.BURN){ if(this.burn.coverage()>=C.BURN_DONE){ this.state=ST.AUTOFILL; } }
    else if(this.state===ST.AUTOFILL){ if(this.burn.autofill(now)){ this.bakedBg=this.burn.bakedBackground(this.paper.cv); this.state=ST.PRINT; this.printTimer=now; this.meterWrap.style.opacity=0; this.stage.classList.remove('knife'); } }
    else if(this.state===ST.PRINT){ if(now-this.printTimer>C.PRINT_LINE_MS){ this.printTimer=now; if(this.type.advanceLine()){ this.state=ST.INTERACT; this.hint.style.opacity=0.001; this.hint.textContent='drag through the words — shake the letters loose'; this.hint.style.opacity=1; setTimeout(()=>this.hint.style.opacity=0,3200); } } }
    else if(this.state===ST.INTERACT){ if(this.shed>=C.MELT_AFTER_SHED)this._startMelt(); }
    else if(this.state===ST.MELT){ const k=Math.min(1,(now-this.meltT0)/C.MELT_MS); this.tear.t=k; if(k>=1)this.state=ST.END; }

    // physics letters
    const wallL=2,wallR=this.W-2,floorY=this.H-C.FLOOR_MARGIN;
    for(let i=this.letters.length-1;i>=0;i--){ const L=this.letters[i]; const lx=L.step(wallL,wallR,floorY);
      if(L.dead){ this.impacts.push(new Impact(lx,floorY)); this.shed++; this.letters.splice(i,1); } }
    this.impacts=this.impacts.filter(im=>im.step());
    for(let i=this.embers.length-1;i>=0;i--){ const e=this.embers[i]; e.age++; e.x+=e.vx; e.y+=e.vy; e.vy+=0.02; if(e.age>=e.life)this.embers.splice(i,1); }

    // ---- render scene ----
    const sc=this.sc,w=this.W,h=this.H; clear(sc,w,h);
    if(this.state===ST.PORTRAIT){ if(this.portrait.dirty||this.portrait.live.size)this.portrait.render(); sc.drawImage(this.portrait.cv,0,0,w,h); }
    else if(this.state===ST.BURN||this.state===ST.AUTOFILL){ this.burn.composite(sc,this.paper.cv,this.portrait.cv); }
    else { // PRINT / INTERACT / MELT / END
      sc.drawImage(this.bakedBg||this.paper.cv,0,0,w,h);
      if(this.state===ST.PRINT||this.state===ST.INTERACT){ this.type.render(); sc.drawImage(this.type.cv,0,0,w,h); sc.drawImage(this.ink.cv,0,0,w,h); }
      else { this._renderMelt(sc); }
    }

    // ---- render fx (top) ----
    const fc=this.fc; clear(fc,w,h);
    fc.globalCompositeOperation='lighter'; for(const e of this.embers){ const t=1-e.age/e.life; fc.globalAlpha=t; const g=fc.createRadialGradient(e.x,e.y,0,e.x,e.y,e.s*2.5);
      g.addColorStop(0,e.col); g.addColorStop(1,'rgba(60,90,160,0)'); fc.fillStyle=g; fc.beginPath(); fc.arc(e.x,e.y,e.s*2.5,0,7); fc.fill(); }
    fc.globalAlpha=1; fc.globalCompositeOperation='source-over';
    for(const L of this.letters)L.draw(fc);
    for(const im of this.impacts)im.draw(fc);
    if(this.state===ST.BURN&&this.ptr.active)this._drawKnife(fc,this.ptr.x,this.ptr.y);

    requestAnimationFrame(t=>this.loop(t));
  }
  _renderMelt(sc){ const k=this.tear.t, cx=this.W/2, cy=this.H*0.5;
    // melting glyphs: flow down, stretch, drift to centre, fade
    sc.textAlign='left'; sc.textBaseline='alphabetic';
    for(const m of this.meltGlyphs){ const fall=k*k*(this.H*0.6); const sy=1+k*2.2; const x=m.x0+(cx-m.x0)*k*0.35; const y=m.y0+fall;
      sc.save(); sc.translate(x,y); sc.scale(1,sy); sc.globalAlpha=1-k*0.9; sc.font=`${m.g.bold?800:400} ${this.type.fs}px 'JetBrains Mono',monospace`; sc.fillStyle=C.TEAR_INK; sc.fillText(m.g.ch,0,0); sc.restore(); }
    sc.globalAlpha=1;
    // central teardrop grows + dynamic wobble/drip
    const grow=smooth(Math.min(1,k*1.4)); const R=Math.min(this.W,this.H)*0.10*grow; const t=performance.now()*0.003;
    const wob=1+Math.sin(t)*0.04; const tipY=cy-R*2.0*wob;
    this._teardrop(sc,cx,cy,R,wob,tipY);
    // periodic drip
    const dripPhase=(performance.now()*0.0006)%1; const dy=cy+R+dripPhase*this.H*0.4;
    sc.fillStyle=C.TEAR_INK; sc.globalAlpha=(1-dripPhase)*grow; sc.beginPath(); sc.arc(cx,dy,R*0.22*(1-dripPhase),0,7); sc.fill(); sc.globalAlpha=1;
  }
  _teardrop(c,cx,cy,R,wob,tipY){ c.save(); c.beginPath(); c.moveTo(cx,tipY);
    c.bezierCurveTo(cx+R*1.1,cy-R*0.6, cx+R, cy+R*0.4, cx, cy+R);
    c.bezierCurveTo(cx-R, cy+R*0.4, cx-R*1.1, cy-R*0.6, cx, tipY); c.closePath();
    const g=c.createRadialGradient(cx-R*0.3,cy-R*0.2,R*0.1,cx,cy,R*1.4); g.addColorStop(0,'#3a4a63'); g.addColorStop(0.5,C.TEAR_INK); g.addColorStop(1,'#05070c');
    c.fillStyle=g; c.fill();
    c.beginPath(); c.ellipse(cx-R*0.32,cy-R*0.1,R*0.22,R*0.34,-0.4,0,7); c.fillStyle='rgba(188,216,255,0.55)'; c.fill(); c.restore(); }
  _drawKnife(c,x,y){ c.save(); c.translate(x,y); c.rotate(-0.5);
    c.beginPath(); c.moveTo(0,0); c.lineTo(-6,-34); c.lineTo(0,-46); c.lineTo(4,-34); c.closePath();
    const g=c.createLinearGradient(0,-46,0,0); g.addColorStop(0,'#eef6ff'); g.addColorStop(1,'#9fb6c9'); c.fillStyle=g; c.fill();
    c.strokeStyle='rgba(20,30,40,.5)'; c.lineWidth=1; c.stroke();
    c.fillStyle='#2a1c12'; c.fillRect(-3,0,6,16); c.fillStyle='#caa46a'; c.fillRect(-3,2,6,2);
    c.restore(); }
}

/* ------------------------------ boot --------------------------------- */
function boot(){ const img=new Image(); img.onload=()=>{ window.__app=new App(img); };
  img.onerror=()=>{ window.__app=new App(img); }; img.src=IMG_SRC; }
if(document.fonts&&document.fonts.ready){ Promise.all([document.fonts.load("13px 'JetBrains Mono'"),document.fonts.load("800 24px 'JetBrains Mono'")]).catch(()=>{});
  document.fonts.ready.then(boot); setTimeout(()=>{if(!window.__app)boot();},1800); } else boot();
</script>
