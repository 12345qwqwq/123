<style>
  :root{

  }

    font-family:'JetBrains Mono',ui-monospace,monospace;

  header{
    flex:0 0 auto;padding:14px 18px 10px;

    font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;

  }

  }
  #cover-meter{
    position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
    width:180px;height:2px;background:rgba(143,195,230,.18);border-radius:2px;
    overflow:hidden;z-index:6;transition:opacity .5s;
  }
  #cover-meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#8fc3e6,#ff7a1e);transition:width .12s linear;}
  #panel{
    position:absolute;right:12px;top:12px;z-index:10;width:230px;max-width:calc(100vw - 24px);
    background:rgba(10,13,24,.78);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);box-shadow:0 18px 50px -20px #000;overflow:hidden;

    border-radius:9px;padding:9px 6px;cursor:pointer;transition:background .2s;
  }
  button:hover{background:rgba(143,195,230,.18);}
  #toggle{
    position:absolute;right:12px;top:12px;z-index:9;width:38px;height:38px;border-radius:50%;

  }

</style>
</head>
<body>
  <header>
    <h1>Part Two</h1>
    <span class="sub">the bystander &middot; no. 17</span>
  </header>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <div id="hint">drag across the words &mdash; or sweep your finger &mdash; until the page catches fire</div>
    <div id="cover-meter"><i></i></div>
    <button id="toggle" title="controls">&#9881;</button>
    <div id="panel">
      <div class="head"><span>controls</span><button class="close" id="closeP">&times;</button></div>
      <div class="body">
        <div class="row"><label>burn speed <b id="vBurn">1.0</b></label><input id="sBurn" type="range" min="0.4" max="2.2" step="0.1" value="1"></div>
        <div class="row"><label>ember density <b id="vDens">1.0</b></label><input id="sDens" type="range" min="0" max="2.5" step="0.1" value="1"></div>
        <div class="row"><label>text size <b id="vFont">1.0</b></label><input id="sFont" type="range" min="0.7" max="1.5" step="0.05" value="1"></div>
        <div class="btns"><button id="ignite">ignite now</button><button id="replay">replay</button></div>
      </div>
    </div>
  </div>

<script>
"use strict";
/* =======================================================================
   PART TWO — burning-paper reveal
   Single-file generative piece. Continues Part One.
   Layers:  GLSL burn/melt composite  ->  blue ember particles (2D, top)
   ======================================================================= */

/* ----------------------------- GLOBAL CONSTANTS ----------------------- */
const C = {
  // paper / ink
  PAPER_TOP:   '#efe7d2',
  PAPER_BOT:   '#d9c9a4',
  PAPER_AGED:  '#e6dcc2',   // content page, a touch more aged
  INK:         '#241a10',
  TITLE_INK:   '#1c140c',
  // ash colour revealed where the page burns through  (matches shader ASH)
  ASH:         '#1a130c',
  // margins (fractions of the smaller stage dimension / width)
  MARGIN_X_F:  0.085,
  MARGIN_TOP:  64,
  MARGIN_BOT:  54,
  LINE_RATIO:  1.62,        // line-height / font-size
  FONT_MAX:    26,          // px ceiling before auto-fit shrinks to fill page
  FONT_MIN:    10,
  // interaction
  IGNITE_THRESHOLD: 0.80,   // fraction of title strokes swiped before ignition
  BRUSH_R:     46,          // css px swipe brush radius
  COVER_CELL:  13,          // css px coverage-grid cell
  // burn timing
  PROG_MAX:    1.65,        // u_progress end value (uv-distance units)
  BURN_MS:     3400,
  HOLD_MS:     900,         // pause fully-burnt before melt
  MELT_MS:     4600,
  // typewriter
  TYPE_PER_FRAME: 14,
  // heat tremble
  TREMBLE_FREQ: 0.017,      // * ms
  TREMBLE_AMP:  1.7,        // px
  // embers (cool + warm BLUE tones)
  EMBER_COLORS: ['#cfeaff','#9fd8ff','#6fb0ff','#4f8fff','#7fd0ff','#bfe6ff'],
  SPARK_BASE:   2.3,        // px base radius
  SPARK_RATE:   7,          // spawned per frame at density 1 during burn
  SPARK_MAX:    900,
  SPARK_VY:     1.4,        // upward speed (px/frame, negated)
  SPARK_JITTER: 0.9,        // horizontal uniform jitter per frame
  SPARK_LIFE:   [50,120],   // frames
};

/* ----------------------------- THE NARRATIVE -------------------------- */
const STORY = [
  "You are number seventeen at the home for the disabled. A single sweet, once, undid the whole of your life.",
  "The man crouched down. The wrapper turned between his fingers, and the sun broke a small rainbow across it. You reached out your hand.",
  "Then the basement. Very small. The air damp and mouldy, like a coffin measured in advance to fit you. The bare bulb buzzed overhead, white and scalding, and seared the tears from your eyes. You thought that was the worst of it.",
  "When the acid touched your face you learned what worst could mean. The pain was close to dying. You screamed, and the sound came back at you off the concrete, again and again.",
  "Your mind began to blur. You remembered the butterfly from the textbook. People only know that it turns into something beautiful. They do not know that inside the cocoon the caterpillar melts, and burns, and sloughs itself away in agony. And your ending would not even be beauty.",
  "He studied you the way a sculptor studies an unfinished work. But what he wanted was ruin. Perhaps one more line here, he said, tilting his head. A little asymmetry is better. And the voice is a problem too. The tip of the knife pressed against skin.",
  "Your voice became a spoiled tape. You could feel it shaking in your throat, and all that came out was the hiss of friction, a radio caught between stations.",
  "He left you at the edge of the road. A square of cardboard, the words on it written neatly: born this way, no one in the world, kind people please help. You wanted to tear it down. You wanted to scream that it was not something you were born with, that someone had done this to you, that they should call the police, that you would kill him. But you could not make a sound.",
  "Coins dropped into the tin bowl. One. Another. Two more. Someone crouched to look at you, said what a poor child, then stood and walked away. Your arms had no strength and your mouth had no words. The burning was still printed deep inside your head, breaking your thoughts into pieces.",
  "You lowered your head. The coins lay stacked in the bowl, and in them, blurred, a face. — Who are you?"
];

/* ----------------------------- WEBGL HELPERS -------------------------- */
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl', { antialias:true, premultipliedAlpha:false });
if(!gl){ alert('WebGL is required for Part Two.'); throw new Error('no webgl'); }

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src);
  return s;
}
function makeProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function makeTex(){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}
function uploadTex(tex, canvas){
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
}

const VS = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){ v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.0,1.0); }`;

/* The core burn-diffusion + melt fragment shader (spec ③ + finale) */
const FS = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_cover;
uniform sampler2D u_content;
uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_center;
uniform float u_progress;
uniform float u_melt;
uniform float u_aspect;

const vec3 ASH = vec3(0.10,0.075,0.05);

// ---- value noise / fbm (multi-octave) ----
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),
             mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.0; a*=0.5; }
  return v;
}

// warm flame colour pool, mapped char -> ember -> flame -> bright
vec3 flamePool(float e){
  e=clamp(e,0.0,1.0);
  vec3 c0=vec3(0.16,0.07,0.02);
  vec3 c1=vec3(0.37,0.12,0.02);
  vec3 c2=vec3(0.70,0.27,0.04);
  vec3 c3=vec3(1.00,0.48,0.12);
  vec3 c4=vec3(1.00,0.76,0.36);
  vec3 c5=vec3(1.00,0.94,0.78);
  float t=e*5.0;
  if(t<1.0) return mix(c0,c1,t);
  if(t<2.0) return mix(c1,c2,t-1.0);
  if(t<3.0) return mix(c2,c3,t-2.0);
  if(t<4.0) return mix(c3,c4,t-3.0);
  return mix(c4,c5,t-4.0);
}

vec3 sampleContent(vec2 uv, float m){
  if(m<=0.001) return texture2D(u_content,uv).rgb;
  float r=m*0.012;                       // blur radius grows with melt
  vec3 s=texture2D(u_content,uv).rgb*0.36;
  s+=texture2D(u_content,uv+vec2( r,0.0)).rgb*0.16;
  s+=texture2D(u_content,uv+vec2(-r,0.0)).rgb*0.16;
  s+=texture2D(u_content,uv+vec2(0.0, r)).rgb*0.16;
  s+=texture2D(u_content,uv+vec2(0.0,-r)).rgb*0.16;
  return s;
}

void main(){
  vec2 uv=v_uv;

  // ---- content sampling, with acid melt flow ----
  vec2 cuv=uv;
  if(u_melt>0.0){
    float drip = fbm(vec2(uv.x*7.0, u_time*0.18+uv.x*3.0));
    cuv.y += u_melt*(0.16*drip + 0.05);                 // flow downward
    cuv.x += sin(uv.y*42.0 + u_time*1.6)*0.005*u_melt;  // lateral wobble
  }
  vec3 content = sampleContent(cuv, u_melt);
  if(u_melt>0.0){                                       // acidic corrosion tint
    vec3 acid=vec3(0.55,1.05,0.78);
    content=mix(content, content*acid, u_melt*0.55);
    float g=dot(content,vec3(0.34,0.5,0.16));
    content=mix(content, vec3(g)*vec3(0.8,1.0,0.85), u_melt*0.30);
  }

  vec3 cover = texture2D(u_cover, uv).rgb;

  // ---- burn field: radial diffusion broken up by multi-octave noise ----
  vec2 d=uv-u_center; d.x*=u_aspect;
  float dist=length(d);
  float nz=(fbm(uv*4.0)+0.5*fbm(uv*9.0+13.0)+0.25*fbm(uv*19.0+47.0))/1.75;
  float b = u_progress - (dist + (nz-0.5)*0.34);

  const float T_FLAME=0.0;
  const float T_THROUGH=0.055;

  vec3 col;
  if(b < T_FLAME){
    col = cover;                                         // unburned page
  } else if(b < T_THROUGH){
    float e=(b-T_FLAME)/(T_THROUGH-T_FLAME);             // 0..1 across the ember edge
    vec3 fire=flamePool(e);
    col=mix(cover, fire, smoothstep(0.0,0.22,e));        // paper chars then flames
  } else {
    float scorch = 1.0 - smoothstep(T_THROUGH, T_THROUGH+0.10, b);
    col = mix(content, ASH, scorch*0.9);                 // burned through -> ash, then text
  }

  // faint heat glow hugging the flame ring
  float ring = exp(-pow((b-0.025)/0.05, 2.0));
  col += vec3(1.0,0.5,0.15)*ring*0.35*step(T_FLAME-0.06,b)*step(b,T_THROUGH+0.02);

  gl_FragColor=vec4(col,1.0);
}`;

const prog = makeProgram(VS, FS);
const U = {};
['u_cover','u_content','u_res','u_time','u_center','u_progress','u_melt','u_aspect']
  .forEach(n=> U[n]=gl.getUniformLocation(prog,n));

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const coverTex = makeTex();
const contentTex = makeTex();

/* ----------------------------- PAPER -------------------------------- */
class Paper {
  // builds vintage-paper buffers and the swipe-coverage mask for the title
  constructor(){
    this.cover   = document.createElement('canvas');
    this.content = document.createElement('canvas');   // paper-only base for content page
    this.cctx = this.cover.getContext('2d');
    this.nctx = this.content.getContext('2d');
    this.cells = [];     // {x,y} css coords of title-ink coverage cells
    this.totalCells = 0;
  }
  _base(ctx, w, h, dpr, topCol, botCol){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const g=ctx.createLinearGradient(0,0,w*0.3,h);
    g.addColorStop(0, topCol); g.addColorStop(1, botCol);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    // paper fibres
    ctx.globalAlpha=0.05;
    for(let i=0;i<Math.min(2600,w*h/360);i++){
      const x=Math.random()*w, y=Math.random()*h, len=2+Math.random()*7, a=Math.random()*Math.PI;
      ctx.strokeStyle = Math.random()<0.5 ? '#6b5836' : '#fffaf0';
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len); ctx.stroke();
    }
    ctx.globalAlpha=1;
    // soft brown stains
    for(let i=0;i<7;i++){
      const x=Math.random()*w, y=Math.random()*h, r=40+Math.random()*120;
      const rg=ctx.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,'rgba(120,92,50,'+(0.04+Math.random()*0.05)+')');
      rg.addColorStop(1,'rgba(120,92,50,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    // vignette
    const vg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.32,w/2,h/2,Math.max(w,h)*0.62);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(60,40,18,0.30)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
  }
  _titleLayout(w,h){
    const big=Math.min(w*0.26, h*0.30);
    return { big, x:w/2, y1:h*0.40, y2:h*0.40+big*0.92, small:big*0.16, ys:h*0.40+big*1.5 };
  }
  _drawTitle(ctx, w, h, forMask){
    const L=this._titleLayout(w,h);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = forMask ? '#fff' : C.TITLE_INK;
    ctx.font = `italic 600 ${L.big}px 'Cormorant Garamond', serif`;
    ctx.fillText('PART', L.x, L.y1);
    ctx.fillText('TWO',  L.x, L.y2);
    if(!forMask){
      ctx.fillStyle='rgba(40,28,16,0.7)';
      ctx.font = `${L.small}px 'JetBrains Mono', monospace`;
      ctx.fillText('B Y S T A N D E R   ·   N O. 17', L.x, L.ys);
    }
  }
  build(w,h,dpr){
    for(const cv of [this.cover,this.content]){ cv.width=w*dpr; cv.height=h*dpr; }
    // cover page (PART TWO)
    this._base(this.cctx, w, h, dpr, C.PAPER_TOP, C.PAPER_BOT);
    this._drawTitle(this.cctx, w, h, false);
    // content page base (aged), text added later by Typesetter
    this._base(this.nctx, w, h, dpr, C.PAPER_AGED, C.PAPER_BOT);
    // coverage mask from the title alpha, in css coords
    const mask=document.createElement('canvas'); mask.width=w; mask.height=h;
    const mctx=mask.getContext('2d');
    this._drawTitle(mctx, w, h, true);
    const data=mctx.getImageData(0,0,w,h).data;
    this.cells=[];
    const step=C.COVER_CELL;
    for(let y=step/2;y<h;y+=step){
      for(let x=step/2;x<w;x+=step){
        const a=data[((y|0)*w+(x|0))*4+3];
        if(a>40) this.cells.push({x,y});
      }
    }
    this.totalCells=this.cells.length || 1;
  }
  // darken the cover where the reader has swiped (charring feedback)
  scorch(x,y,r){
    const ctx=this.cctx;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(30,18,8,0.34)');
    g.addColorStop(0.7,'rgba(60,30,10,0.14)');
    g.addColorStop(1,'rgba(60,30,10,0)');
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.restore();
  }
}

/* ----------------------------- TYPESETTER --------------------------- */
class Typesetter {
  // custom justified (two-edge) layout, pre-drawn buffer, typewriter + heat tremble
  constructor(paper){
    this.paper=paper;
    this.canvas=document.createElement('canvas');
    this.ctx=this.canvas.getContext('2d');
    this.glyphs=[];        // {ch,x,y,phase}
    this.typed=0;
    this.fontSize=14;
    this.dpr=1;
  }
  _wrap(charW, spaceW, boxW){
    // greedy wrap each paragraph; returns array of lines {words:[{text,w}], paraEnd}
    const lines=[];
    for(const para of STORY){
      const words=para.split(' ').map(t=>({text:t, w:t.length*charW}));
      let cur=[], curW=0;
      for(const word of words){
        const add=(cur.length? spaceW:0)+word.w;
        if(cur.length && curW+add>boxW){ lines.push({words:cur, paraEnd:false}); cur=[]; curW=0; }
        cur.push(word); curW+=(cur.length>1?spaceW:0)+word.w;
      }
      if(cur.length) lines.push({words:cur, paraEnd:true});
      lines.push({words:[], paraEnd:true, blank:true});   // paragraph gap
    }
    return lines;
  }
  layout(w,h,dpr,fontScale){
    this.dpr=dpr;
    const boxX=Math.round(w*C.MARGIN_X_F);
    const boxW=w-2*boxX;
    const boxTop=C.MARGIN_TOP, boxBot=h-C.MARGIN_BOT;
    const boxH=boxBot-boxTop;
    // auto-fit font so the whole story fills the page within margins
    let fs=Math.min(C.FONT_MAX, w/30)*fontScale;
    const ctx=this.ctx;
    let lines, lh;
    for(;;){
      ctx.font=`${fs}px 'JetBrains Mono', monospace`;
      const charW=ctx.measureText('M').width, spaceW=charW;
      lines=this._wrap(charW, spaceW, boxW);
      lh=fs*C.LINE_RATIO;
      const need=lines.length*lh;
      if(need<=boxH || fs<=C.FONT_MIN) break;
      fs*=0.96;
    }
    this.fontSize=fs;
    ctx.font=`${fs}px 'JetBrains Mono', monospace`;
    const charW=ctx.measureText('M').width, spaceW=charW;
    // place glyphs with justified gaps
    this.glyphs=[];
    let y=boxTop+lh*0.7;
    let gi=0;
    for(const line of lines){
      if(line.blank){ y+=lh*0.55; continue; }
      const n=line.words.length;
      const natural=line.words.reduce((s,w0)=>s+w0.w,0)+spaceW*(n-1);
      let gap=spaceW;
      if(!line.paraEnd && n>1) gap=spaceW+(boxW-natural)/(n-1);   // stretch to right edge
      let x=boxX;
      for(let wi=0;wi<n;wi++){
        const word=line.words[wi];
        for(const ch of word.text){
          if(ch!==' ') this.glyphs.push({ch, x, y, phase:(gi++%53)*0.41});
          x+=charW;
        }
        x+=gap;
      }
      y+=lh;
    }
    this.canvas.width=w*dpr; this.canvas.height=h*dpr;
    this.typed=0;
  }
  advance(n){ this.typed=Math.min(this.glyphs.length, this.typed+n); }
  done(){ return this.typed>=this.glyphs.length; }
  // render paper + typed glyphs (with heat tremble) into the content buffer
  render(nowMs, heat){
    const ctx=this.ctx, dpr=this.dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    ctx.drawImage(this.paper.content, 0,0, this.canvas.width/dpr, this.canvas.height/dpr);
    ctx.font=`${this.fontSize}px 'JetBrains Mono', monospace`;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillStyle=C.INK;
    const amp=C.TREMBLE_AMP*heat;
    for(let i=0;i<this.typed;i++){
      const g=this.glyphs[i];
      let dy=0,dx=0;
      if(amp>0.01){
        dy=Math.sin(nowMs*C.TREMBLE_FREQ + g.phase)*amp;
        dx=Math.sin(nowMs*C.TREMBLE_FREQ*0.7 + g.phase*1.7)*amp*0.4;
      }
      ctx.fillText(g.ch, g.x+dx, g.y+dy);
    }
  }
}

/* ----------------------------- EMBERS ------------------------------- */
class Spark {
  constructor(x,y){ this.reset(x,y); }
  reset(x,y){
    this.x=x; this.y=y;
    this.vx=(Math.random()*2-1)*1.4;
    this.vy=-(C.SPARK_VY*(0.5+Math.random()));
    this.size=C.SPARK_BASE*(0.6+Math.random()*0.9);
    this.life=C.SPARK_LIFE[0]+Math.random()*(C.SPARK_LIFE[1]-C.SPARK_LIFE[0]);
    this.age=0;
    this.col=C.EMBER_COLORS[(Math.random()*C.EMBER_COLORS.length)|0];
  }
  step(){
    this.x+=this.vx+(Math.random()*2-1)*C.SPARK_JITTER;  // hot-air horizontal jitter
    this.y+=this.vy;
    this.vy+=0.012;            // slight buoyancy decay
    this.age++;
    return this.age<this.life;
  }
  draw(ctx){
    const t=1-this.age/this.life;
    const r=this.size*(0.4+t*0.8);
    ctx.globalAlpha=t;
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*2.5);
    g.addColorStop(0,this.col); g.addColorStop(0.4,this.col); g.addColorStop(1,'rgba(40,90,160,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,r*2.5,0,7); ctx.fill();
  }
}
class SparkField {
  constructor(canvas){ this.canvas=canvas; this.ctx=canvas.getContext('2d'); this.list=[]; this.dpr=1; this.W=0; this.H=0; }
  resize(w,h,dpr){ this.dpr=dpr; this.W=w; this.H=h; this.canvas.width=w*dpr; this.canvas.height=h*dpr; }
  emit(cx,cy,radiusPx,count){
    for(let i=0;i<count && this.list.length<C.SPARK_MAX;i++){
      const a=Math.random()*Math.PI*2;
      const rr=radiusPx*(0.86+Math.random()*0.20);
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      if(x<-20||x>this.W+20||y<-20||y>this.H+20) continue;
      this.list.push(new Spark(x,y));
    }
  }
  frame(){
    const ctx=this.ctx;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,this.W,this.H);
    ctx.globalCompositeOperation='lighter';
    for(let i=this.list.length-1;i>=0;i--){
      const s=this.list[i];
      if(!s.step()){ this.list.splice(i,1); continue; }
      s.draw(ctx);
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  clear(){ this.list.length=0; this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); }
}

/* ----------------------------- APP / STATE MACHINE ------------------ */
const STATE={ COVER:'cover', BURNING:'burning', HOLD:'hold', MELT:'melt', END:'end' };

class App {
  constructor(){
    this.stage=document.getElementById('stage');
    this.fx=document.getElementById('fx');
    this.hint=document.getElementById('hint');
    this.meterWrap=document.getElementById('cover-meter');
    this.meter=this.meterWrap.querySelector('i');
    this.paper=new Paper();
    this.type=new Typesetter(this.paper);
    this.sparks=new SparkField(this.fx);
    this.dpr=Math.min(window.devicePixelRatio||1, 2);
    this.W=0; this.H=0;
    this.state=STATE.COVER;
    this.visited=new Set();
    this.coverage=0;
    this.center={x:0.5,y:0.5};      // uv
    this.centerPx={x:0,y:0};
    this.progress=0; this.melt=0;
    this.tBurn=0; this.tHold=0; this.tMelt=0;
    this.coverDirty=true; this.contentDirty=true; this.contentStatic=false;
    this.heat=0;
    // tunables
    this.burnSpeed=1; this.density=1; this.fontScale=1;
    this.ptr={x:0,y:0};
    this._bind();
    this.resize();
    requestAnimationFrame(t=>this.loop(t));
  }
  resize(){
    const w=this.stage.clientWidth, h=this.stage.clientHeight;
    this.W=w; this.H=h;
    this.dpr=Math.min(window.devicePixelRatio||1, 2);
    for(const cv of [glCanvas]){ cv.width=w*this.dpr; cv.height=h*this.dpr; }
    this.sparks.resize(w,h,this.dpr);
    this.paper.build(w,h,this.dpr);
    this.type.layout(w,h,this.dpr,this.fontScale);
    this.coverDirty=true; this.contentDirty=true; this.contentStatic=false;
    if(this.state===STATE.COVER){ this.visited.clear(); this.coverage=0; this._setMeter(0); }
    uploadTex(coverTex, this.paper.cover);
    uploadTex(contentTex, this.type.canvas);
  }
  _bind(){
    const move=e=>{
      const r=this.stage.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
      const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      this.ptr.x=x; this.ptr.y=y;
      if(this.state===STATE.COVER) this._swipe(x,y);
      if(!this.hintGone){ this.hintGone=true; this.hint.style.opacity=0; }
    };
    this.stage.addEventListener('pointermove', move, {passive:true});
    this.stage.addEventListener('pointerdown', move, {passive:true});
    let rt=null;
    window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>this.resize(),150); });
    // controls
    const panel=document.getElementById('panel'), toggle=document.getElementById('toggle');
    document.getElementById('closeP').onclick=()=>{ panel.classList.add('collapsed'); toggle.classList.add('show'); };
    toggle.onclick=()=>{ panel.classList.remove('collapsed'); toggle.classList.remove('show'); };
    const bind=(id,disp,fn,fmt)=>{ const el=document.getElementById(id),o=document.getElementById(disp);
      el.oninput=()=>{ fn(parseFloat(el.value)); o.textContent=fmt?fmt(el.value):el.value; }; };
    bind('sBurn','vBurn',v=>this.burnSpeed=v,v=>(+v).toFixed(1));
    bind('sDens','vDens',v=>this.density=v,v=>(+v).toFixed(1));
    bind('sFont','vFont',v=>{ this.fontScale=v; this.type.layout(this.W,this.H,this.dpr,v);
      this.contentStatic=false; this.contentDirty=true; },v=>(+v).toFixed(2));
    document.getElementById('ignite').onclick=()=>{ if(this.state===STATE.COVER){ this._ignite(this.ptr.x||this.W/2, this.ptr.y||this.H/2); } };
    document.getElementById('replay').onclick=()=>this._reset();
  }
  _setMeter(v){ this.meter.style.width=Math.min(100,v*100)+'%'; }
  _swipe(x,y){
    const r=C.BRUSH_R, r2=r*r;
    let added=false;
    for(let ci=0;ci<this.paper.cells.length;ci++){
      const c=this.paper.cells[ci];
      const dx=c.x-x, dy=c.y-y;
      if(dx*dx+dy*dy<r2){ const k=(c.x|0)+'_'+(c.y|0); if(!this.visited.has(k)){ this.visited.add(k); added=true; } }
    }
    if(added){
      this.paper.scorch(x,y,r*0.9); this.coverDirty=true;
      this.coverage=this.visited.size/this.paper.totalCells;
      this._setMeter(this.coverage/C.IGNITE_THRESHOLD);
      if(this.coverage>=C.IGNITE_THRESHOLD) this._ignite(x,y);
    }
  }
  _ignite(px,py){
    this.state=STATE.BURNING;
    this.centerPx={x:px,y:py};
    this.center={x:px/this.W, y:1-py/this.H};
    this.tBurn=performance.now();
    this.meterWrap.style.opacity=0;
    this.hint.style.opacity=0;
  }
  _reset(){
    this.state=STATE.COVER;
    this.visited.clear(); this.coverage=0; this.progress=0; this.melt=0; this.heat=0;
    this.contentStatic=false;
    this.sparks.clear();
    this.paper.build(this.W,this.H,this.dpr);
    this.type.layout(this.W,this.H,this.dpr,this.fontScale);
    uploadTex(coverTex, this.paper.cover);
    this.contentDirty=true; this.coverDirty=true;
    this.meterWrap.style.opacity=1; this._setMeter(0);
    this.hint.style.opacity=1; this.hintGone=false;
  }
  loop(now){
    // ---- state progression ----
    if(this.state===STATE.BURNING){
      const k=(now-this.tBurn)/(C.BURN_MS/this.burnSpeed);
      this.progress=Math.min(C.PROG_MAX, k*C.PROG_MAX);
      this.heat=Math.min(1, k*1.4);
      this.type.advance(C.TYPE_PER_FRAME);
      // ember emission along the flame ring
      const radius=this.progress*this.H;     // uv-dist * height ~= px radius
      if(this.progress<1.45){
        this.sparks.emit(this.centerPx.x, this.centerPx.y, radius, Math.round(C.SPARK_RATE*this.density));
      }
      this.contentDirty=true;
      if(this.progress>=C.PROG_MAX){ this.state=STATE.HOLD; this.tHold=now; }
    } else if(this.state===STATE.HOLD){
      this.heat=Math.max(0, this.heat-0.02);
      this.type.advance(C.TYPE_PER_FRAME*3);
      this.contentDirty=true;
      if(now-this.tHold>C.HOLD_MS){ this.state=STATE.MELT; this.tMelt=now; this.contentStatic=true; this.contentDirty=true; }
    } else if(this.state===STATE.MELT){
      const k=(now-this.tMelt)/C.MELT_MS;
      this.melt=Math.min(1, k);
      if(this.melt>=1) this.state=STATE.END;
    }

    // ---- buffer uploads ----
    if(this.coverDirty){ uploadTex(coverTex, this.paper.cover); this.coverDirty=false; }
    if(this.contentDirty && !this.contentStatic){
      this.type.render(now, this.heat);
      uploadTex(contentTex, this.type.canvas);
      if(this.state!==STATE.BURNING && this.state!==STATE.HOLD) this.contentDirty=false;
    } else if(this.contentDirty && this.contentStatic){
      this.type.render(now, 0);                 // bake one clean frame for the melt to chew on
      uploadTex(contentTex, this.type.canvas);
      this.contentDirty=false;
    }

    // ---- draw GL composite ----
    gl.viewport(0,0,glCanvas.width,glCanvas.height);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, coverTex);   gl.uniform1i(U.u_cover,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, contentTex); gl.uniform1i(U.u_content,1);
    gl.uniform2f(U.u_res, glCanvas.width, glCanvas.height);
    gl.uniform1f(U.u_time, now*0.001);
    gl.uniform2f(U.u_center, this.center.x, this.center.y);
    gl.uniform1f(U.u_progress, this.progress);
    gl.uniform1f(U.u_melt, this.melt);
    gl.uniform1f(U.u_aspect, this.W/this.H);
    gl.drawArrays(gl.TRIANGLES,0,3);

    // ---- embers on top ----
    this.sparks.frame();

    requestAnimationFrame(t=>this.loop(t));
  }
}

/* boot once fonts are ready (justified layout needs accurate metrics) */
function boot(){ window.__app = new App(); }
if(document.fonts && document.fonts.ready){
  Promise.all([
    document.fonts.load("14px 'JetBrains Mono'"),
    document.fonts.load("italic 600 40px 'Cormorant Garamond'")
  ]).catch(()=>{});
  document.fonts.ready.then(boot);
  setTimeout(()=>{ if(!window.__app) boot(); }, 1800);
} else { boot(); }
</script>
